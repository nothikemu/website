<svg viewBox="0 0 180 230" width="180" height="230" xmlns="http://www.w3.org/2000/svg" class="sk">
  <!-- Sakamoto-san (Nichijou), fan art. Paws rest at y=192: the top edge of the panel he sits on. -->
  <defs>
    <linearGradient id="sk-scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef5446" />
      <stop offset="1" stop-color="#c63131" />
    </linearGradient>
  </defs>

  <!-- tail, resting along the panel's top edge with the tip curled up -->
  <g class="sk-tail">
    <path d="M124 186 C 146 192, 166 192, 172 176 C 175 168, 170 162, 164 164" fill="none" stroke="#2c3244" stroke-width="13" stroke-linecap="round" />
    <path d="M124 186 C 146 192, 166 192, 172 176 C 175 168, 170 162, 164 164" fill="none" stroke="#1b1d25" stroke-width="10" stroke-linecap="round" />
    <path d="M140 191 C 156 192, 166 188, 171 178" fill="none" stroke="#121318" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- body -->
  <path d="M50 192 C 40 160, 48 128, 90 120 C 132 128, 140 160, 130 192 Z" fill="#1b1d25" stroke="#2c3244" stroke-width="1.6" />
  <!-- cel shadow, right side -->
  <path d="M100 124 C 128 132, 138 160, 130 192 L 110 192 C 118 168, 114 142, 100 124 Z" fill="#121318" />
  <!-- rim light, left side (the moon is behind him) -->
  <path d="M52 182 C 46 160, 52 138, 70 128" fill="none" stroke="#5b6585" stroke-width="1.6" stroke-linecap="round" opacity=".7" />
  <!-- front legs + paws -->
  <path d="M76 150 L 75 188 M 104 150 L 105 188" stroke="#2c3244" stroke-width="1.5" stroke-linecap="round" />
  <ellipse cx="80" cy="190" rx="12" ry="5" fill="#1b1d25" stroke="#2c3244" stroke-width="1.5" />
  <ellipse cx="101" cy="190" rx="12" ry="5" fill="#16181f" stroke="#2c3244" stroke-width="1.5" />
  <path d="M76 191 v-3 M 82 191 v-3 M 97 191 v-3 M 103 191 v-3" stroke="#2c3244" stroke-width="1.2" stroke-linecap="round" />

  <!-- the scarf Nano knitted -->
  <path d="M58 132 C 72 144, 108 144, 122 132 L 122 140 C 108 152, 72 152, 58 140 Z" fill="#0d0e12" opacity=".75" />
  <g class="sk-scarf">
    <path d="M52 116 C 70 130, 110 130, 128 116 L 130 128 C 110 142, 70 142, 50 128 Z" fill="url(#sk-scarf)" stroke="#7a1c1c" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M56 125 C 72 136, 108 136, 124 125" fill="none" stroke="#9e2424" stroke-width="2" opacity=".7" />
    <path d="M60 120 C 74 129, 104 129, 118 120" fill="none" stroke="#ff8a7c" stroke-width="1.1" opacity=".6" />
    <path d="M106 134 L 99 168 L 107 165 L 112 171 L 119 135 Z" fill="url(#sk-scarf)" stroke="#7a1c1c" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M112 136 L 108 166" stroke="#9e2424" stroke-width="1.6" opacity=".7" />
    <path d="M101 171 l2 -5 l2 5 M 107 172 l2 -5 l2 5" fill="none" stroke="#7a1c1c" stroke-width="1.1" stroke-linecap="round" />
    <circle cx="112" cy="131" r="6.5" fill="#d73b36" stroke="#7a1c1c" stroke-width="1.3" />
    <path d="M109 129 a4 4 0 0 1 5 -1" fill="none" stroke="#ff8a7c" stroke-width="1" opacity=".7" />
  </g>

  <!-- head -->
  <g class="sk-head">
    <path class="sk-ear-l" d="M52 66 L 46 22 C 60 28, 72 38, 80 48 Z" fill="#1b1d25" stroke="#2c3244" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M56 58 L 52 33 C 60 38, 67 44, 72 50 Z" fill="#4a2a35" />
    <path class="sk-ear-r" d="M128 66 L 134 22 C 120 28, 108 38, 100 48 Z" fill="#16181f" stroke="#2c3244" stroke-width="1.6" stroke-linejoin="round" />
    <path d="M124 58 L 128 33 C 120 38, 113 44, 108 50 Z" fill="#40242e" />

    <path
      d="M46 80 C 46 56, 66 42, 90 42 C 114 42, 134 56, 134 80 C 134 92, 132 100, 139 106 L 128 106 C 120 116, 106 122, 90 122 C 74 122, 60 116, 52 106 L 41 106 C 48 100, 46 92, 46 80 Z"
      fill="#1b1d25"
      stroke="#2c3244"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <!-- cel shadow under the jaw + right cheek -->
    <path d="M108 118 C 122 112, 132 100, 134 82 C 136 96, 136 102, 139 106 L 128 106 C 122 113, 116 116, 108 118 Z" fill="#121318" />
    <path d="M56 62 C 62 50, 74 45, 90 45" fill="none" stroke="#5b6585" stroke-width="1.8" stroke-linecap="round" opacity=".7" />

    <!-- eyes: big, round, deadpan -->
    <g class="sk-eyes">
      <ellipse cx="72" cy="84" rx="13" ry="14" fill="#f4f0e4" stroke="#0b0c10" stroke-width="1.5" />
      <ellipse cx="108" cy="84" rx="13" ry="14" fill="#f4f0e4" stroke="#0b0c10" stroke-width="1.5" />
      <g class="sk-pupils">
        <ellipse cx="74" cy="87" rx="5.6" ry="7.4" fill="#0b0c10" />
        <ellipse cx="106" cy="87" rx="5.6" ry="7.4" fill="#0b0c10" />
        <circle cx="76" cy="83" r="2" fill="#fff" />
        <circle cx="108" cy="83" r="2" fill="#fff" />
      </g>
      <!-- heavy upper lids: the unimpressed sakamoto-san look -->
      <path d="M58 84 C 58 66, 86 66, 86 84 C 80 77, 64 77, 58 84 Z" fill="#1b1d25" />
      <path d="M94 84 C 94 66, 122 66, 122 84 C 116 77, 100 77, 94 84 Z" fill="#1b1d25" />
      <path d="M58 81 C 65 75, 79 75, 86 81 M 94 81 C 101 75, 115 75, 122 81" fill="none" stroke="#0b0c10" stroke-width="2.2" stroke-linecap="round" />
    </g>
    <!-- closed eyes, used while he sleeps -->
    <g class="sk-sleep" fill="none" stroke="#0b0c10" stroke-width="2.2" stroke-linecap="round" opacity="0">
      <path d="M61 86 C 66 90, 78 90, 83 86" />
      <path d="M97 86 C 102 90, 114 90, 119 86" />
    </g>

    <!-- nose + mouth + whiskers -->
    <path d="M86.5 100 L 93.5 100 L 90 104 Z" fill="#d68a98" />
    <path d="M90 104 v2.5 M 84 107 c 1.5 2.6 4.5 2.6 6 0 c 1.5 2.6 4.5 2.6 6 0" fill="none" stroke="#8a91a3" stroke-width="1.4" stroke-linecap="round" />
    <g stroke="#6f7790" stroke-width="1.1" stroke-linecap="round" opacity=".85">
      <path d="M62 101 L 34 96 M 62 106 L 33 107" />
      <path d="M118 101 L 146 96 M 118 106 L 147 107" />
    </g>
  </g>

  <!-- music notes: only while something is playing -->
  <g class="sk-notes" fill="#c9d3ec">
    <path class="n1" d="M146 52 v-13 l9 -2.5 v11 a3.3 3.3 0 1 1 -1.7 -2.8 v-5.6 l-5.6 1.6 v9.6 a3.3 3.3 0 1 1 -1.7 -2.8z" />
    <path class="n2" d="M158 32 v-10 a2.8 2.8 0 1 1 -1.4 -2.4 v-5.4 l5.6 2.2 v2.2 l-4.2 -1.7z" />
  </g>
  <!-- z: only while asleep -->
  <g class="sk-z" fill="#8a91a3" font-family="JetBrainsMono Nerd Font, monospace" font-weight="600" opacity="0">
    <text x="142" y="50" font-size="12">z</text>
    <text x="152" y="34" font-size="16">z</text>
  </g>
</svg>
